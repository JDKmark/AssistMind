# 基线 profile：阶梯加压找拐点
# 阶梯由环境变量驱动（Locust 的 LoadTestShape 只要存在就接管 users/spawn/t）：
#   LOAD_STAGES=10:180,25:180,50:180,100:180,200:180,400:180   # 每阶 3 分钟
#   LOAD_SPAWN_RATE=5
# 用法：
#   LOAD_SCENARIO=s4 LOAD_STAGES=10:180,25:180,50:180,100:180,200:180,400:180 \
#     locust -f locustfile.py --headless --config profiles/baseline.conf
#
# 未设置 LOAD_STAGES 时退化为固定并发（下面的 -u/-r 生效），便于快速抽查。
--headless
-u 25
-r 5
-t 3m
--csv baseline
--html baseline.html
--only-summary
