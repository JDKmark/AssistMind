[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assistmind-backend"
version = "0.1.0"
description = "AssistMind - SaaS 产品文档智能问答客服系统后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "qdrant-client>=1.12.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42",
    "mcp>=1.0.0",
    "rq>=2.0",
    # 语音播报 TTS：微软 Edge 云端神经音色（免费无 key），失败降级浏览器 speechSynthesis
    "edge-tts>=7.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "langfuse>=2.0.0",
    "ragas>=0.1.0",
    # ragas 0.3.x 打包缺陷：pillow 在其可选 extra，但 ragas.prompt 在模块级
    # from PIL import Image——不补则 uv sync（严格按锁安装）后 import ragas 即失败
    # （CI 曾因此收集错误：ModuleNotFoundError: No module named 'PIL'）
    "pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
    "structlog>=24.1.0",
    # 文档 ETL：二进制文档（PDF 等）解析入库
    "pypdf>=4.0.0",
    # 失败降级（断路器 + 重试）
    "aiobreaker>=1.2.0",
    "tenacity>=8.2.0",
    # 应用级可观测：/metrics（Prometheus exporter，T5）；未安装/未启用时整体 no-op
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "locust>=2.20.0",
    "fakeredis>=2.20.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 集成测试，需要 Docker 服务运行",
    "requests_smoke: 真实 HTTP 接口冒烟测试（requests + uvicorn 子进程），需要 Docker 服务运行，可 -m requests_smoke 显式挑选",
]
addopts = "-q"
